// CI fails on an unannotated var, throw, null, return, while, asInstanceOf or isInstanceOf.
// A site of encapsulated local mutation carries `// scalafix:ok DisableSyntax.var` (or .while)
// with one sentence of justification, and is listed in docs/design.md.
rules = [
  DisableSyntax
]

DisableSyntax.noVars = true
DisableSyntax.noThrows = true
DisableSyntax.noNulls = true
DisableSyntax.noReturns = true
DisableSyntax.noWhileLoops = true
DisableSyntax.noAsInstanceOf = true
DisableSyntax.noIsInstanceOf = true
DisableSyntax.noFinalize = true
