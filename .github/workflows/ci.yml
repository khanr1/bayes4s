name: Continuous Integration

on:
  pull_request:
    branches: ['**', '!update/**', '!pr/**']
  push:
    branches: ['**', '!update/**', '!pr/**']
    tags: [v*]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BAYES4S_PRIVATE_TERMS_KEY: ${{ secrets.BAYES4S_PRIVATE_TERMS_KEY }}


concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest]
        scala: [3]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Refuse private terms in the tree
        run: python3 scripts/check-private-terms.py

      - name: Refuse private terms in the commit messages
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-private-terms.py --commits ${{ github.event.pull_request.base.sha }}..${{ github.sha }}

      - name: Check the register of local mutation
        run: python3 scripts/check-mutation-register.py

      - name: Check the manual's vocabulary
        run: python3 scripts/check-terminology.py

      - name: Check the table of Stan names
        run: python3 scripts/check-stan-names.py

      - name: Check the manual's checklist
        run: python3 scripts/check-manual.py

      - name: Check the Scaladoc's examples
        run: python3 scripts/check-scaladoc.py

      - name: Check that workflows are up to date
        run: sbt githubWorkflowCheck

      - name: Check headers and formatting
        if: matrix.java == 'temurin@25' && matrix.os == 'ubuntu-latest'
        run: sbt '++ ${{ matrix.scala }}' headerCheckAll scalafmtCheckAll 'project /' scalafmtSbtCheck

      - name: Check scalafix lints
        if: matrix.java == 'temurin@25' && matrix.os == 'ubuntu-latest'
        run: sbt '++ ${{ matrix.scala }}' 'scalafixAll --check'

      - name: Test
        run: sbt '++ ${{ matrix.scala }}' test

      - name: Check binary compatibility
        if: matrix.java == 'temurin@25' && matrix.os == 'ubuntu-latest'
        run: sbt '++ ${{ matrix.scala }}' mimaReportBinaryIssues

      - name: Generate API documentation
        if: matrix.java == 'temurin@25' && matrix.os == 'ubuntu-latest'
        run: sbt '++ ${{ matrix.scala }}' doc

      - name: Compile the manual
        run: sbt '++ ${{ matrix.scala }}' docs/mdoc

      - name: Build the demonstration page
        run: sbt '++ ${{ matrix.scala }}' 'examples/runMain bayes4s.examples.CatalogueDemo target/catalogue.html --quick'

      - name: Render the demonstration page in Chromium
        run: |
          npm ci --prefix scripts
          npm --prefix scripts exec -- playwright install --with-deps chromium
          node scripts/smoke-plots.mjs target/catalogue.html

  site:
    name: Generate Site
    strategy:
      matrix:
        os: [ubuntu-latest]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        id: setup-java-temurin-25
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@25' && steps.setup-java-temurin-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Generate site
        run: sbt docs/tlSite

      - name: Render the manual's figures in Chromium
        run: |
          npm ci --prefix scripts
          npm --prefix scripts exec -- playwright install --with-deps chromium
          node scripts/smoke-plots.mjs docs/target/docs/site/*.html
